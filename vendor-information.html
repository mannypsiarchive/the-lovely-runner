<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archival Vendor Information · The Lovely Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <div class="eyebrow">ARCHIVAL WORKFLOW TOOL</div>
        <h1>Archival Vendor Information <span class="version-tag">1.0</span></h1>
        <p>Search the live Factual Studios vendor grid.</p>
      </div>
      <a class="button ghost back-home" href="index.html">← All tools</a>
    </header>

    <section class="card vendor-card">
      <div class="vendor-search-stage" id="searchPanel">
        <div class="eyebrow">VENDOR GRID</div>
        <h2>Search for a Vendor</h2>
        <div class="vendor-search-box">
          <label class="sr-only" for="vendorSearch">Search for a Vendor</label>
          <input id="vendorSearch" type="search" placeholder="Start typing a vendor name…" autocomplete="off" list="vendorOptions" disabled aria-controls="vendorResults" aria-expanded="false">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <datalist id="vendorOptions"></datalist>
          <div class="vendor-results" id="vendorResults" role="listbox" aria-label="Vendor search results"></div>
        </div>
        <div class="vendor-search-meta" id="searchMeta">Connecting to the live vendor grid…</div>
      </div>

      <div class="vendor-utility">
        <span id="vendorStatus" aria-live="polite">Loading Google connection…</span>
        <button class="button secondary" id="refreshButton" disabled>Refresh Data</button>
        <button class="button ghost" id="connectButton" disabled>Reconnect</button>
      </div>

      <div class="vendor-detail hidden" id="vendorDetail" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="vendor-information.js"></script>
</body>
</html>
