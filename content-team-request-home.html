<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Content Team Requests | The Lovely Runner</title><link rel="stylesheet" href="style.css"><style>.request-wrap{max-width:900px;margin:auto}.request-top{display:flex;justify-content:space-between;align-items:center;margin:22px 0 30px}.request-brand{font-weight:800;color:#eef2ff}.request-brand span{color:#9a82ff}.request-title{max-width:720px;margin-bottom:28px}.request-title h1{font-size:clamp(38px,6vw,60px);line-height:1.02;margin:12px 0}.request-title p{color:#a5aec9;font-size:16px;line-height:1.6}.request-card{padding:clamp(22px,4vw,42px);border:1px solid rgba(153,170,231,.2);border-radius:26px;background:linear-gradient(145deg,rgba(22,31,60,.96),rgba(13,19,39,.96));box-shadow:0 28px 80px rgba(0,0,0,.32)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#e3e9ff;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(157,174,226,.22);border-radius:13px;background:#0d142a;color:#f4f6ff;padding:14px 15px;outline:none}.field input,.field select{min-height:50px}.field textarea{min-height:110px;resize:vertical}.choice-list{display:grid;gap:12px}.choice-list label{display:block;padding:16px 18px;border:1px solid rgba(153,170,231,.2);border-radius:14px;background:rgba(16,25,50,.8);color:#e7ebff;cursor:pointer;transition:.18s}.choice-list label:hover{border-color:#9584ff;background:rgba(116,94,227,.12);transform:translateY(-1px)}.choice-list input{accent-color:#8c7aff;margin-right:12px}.submit-btn{border:0;border-radius:13px;padding:14px 22px;background:linear-gradient(110deg,#8170ff,#5d72ec);color:white;font-weight:800;box-shadow:0 10px 25px rgba(89,91,226,.28);cursor:pointer}.request-foot{text-align:center;color:#7480a1;font-size:12px;margin:18px 0}.success-message{display:none;margin-top:16px;color:#91efc4}.form-actions{display:flex;justify-content:flex-end;margin-top:24px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions .submit-btn{width:100%}}</style></head><body><main class="app-shell request-wrap"><div class="request-top"><a class="dev-back-link" href="dev-tools.html">← Workshop</a><div class="request-brand">THE <span>LOVELY RUNNER</span></div></div><header class="request-title"><div class="eyebrow">CONTENT MANAGEMENT TEAM</div><h1>What would you<br>like to ask?</h1><p>Choose the request that best fits what you need. We’ll take you to the right form.</p></header><section class="request-card"><form id="requestTypeForm"><div class="field"><label for="requestType">Select a request</label><select id="requestType" name="requestType" required><option value="">Choose a request type…</option><option value="content-team-archival-request.html">New Third Party Vendor Licensing Agreement Review and Approval</option><option value="materials-release-redlines.html">A+E Factual Studios Materials Release Redlines</option><option value="agreement-translation.html">Vendor Agreement and Materials Release Translation</option><option value="fair-use-request.html">A+E Factual Studios Fair Use Request</option><option value="public-domain-approval.html">A+E Factual Studios Public Domain Approval</option><option value="vendor-link-request.html">Third Party Vendor Link Request</option><option value="agreement-signature-request.html">Third Party Vendor Agreement Signature Request</option><option value="fair-use-log-submission.html">A+E Factual Studios Fair Use Log Submission</option><option value="promotions-questions.html">A+E Factual Studios Promotions Questions</option></select></div><div class="form-actions"><button class="submit-btn" type="submit">Proceed to Form <span aria-hidden="true">→</span></button></div></form></section><div class="request-foot">The right request, routed to the right team.</div></main><script>document.getElementById('requestTypeForm').addEventListener('submit',e=>{e.preventDefault();const chosen=document.getElementById('requestType').value;if(chosen)location.href=chosen})</script></body></html>
